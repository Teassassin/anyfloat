<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B0ECFF"/><stop offset="1" stop-color="#56B0FF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E4062"/><stop offset="1" stop-color="#141C2C"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5FAFF"/><stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 支架（品牌蓝，非黑色） -->
  <rect x="238" y="330" width="36" height="38" fill="url(#frame)"/>
  <rect x="190" y="366" width="132" height="28" rx="14" ry="14" fill="url(#frame)"/>

  <!-- 屏幕机身 -->
  <rect x="68" y="100" width="376" height="230" rx="34" ry="34"
        fill="url(#screen)" stroke="url(#frame)" stroke-width="6"/>

  <!-- 屏幕内发光边 -->
  <rect x="86" y="118" width="340" height="194" rx="22" ry="22"
        fill="none" stroke="#D0F6FF" stroke-width="5" opacity="0.95" filter="url(#glow)"/>

  <!-- 内嵌小窗（16:9） -->
  <rect x="268" y="219" width="150" height="85" rx="19" ry="19" fill="url(#inner)"/>
</svg>
