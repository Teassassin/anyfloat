<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AAD2FF"/>
      <stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBF5FF"/>
      <stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 16:9 发光外框 -->
  <rect x="46" y="138" width="420" height="236" rx="47" ry="47"
        fill="none" stroke="url(#frame)" stroke-width="24" filter="url(#glow)"/>

  <!-- 右下角内嵌小窗（同样 16:9） -->
  <rect x="256" y="238" width="168" height="94" rx="21" ry="21" fill="url(#inner)"/>
</svg>
